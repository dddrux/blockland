# Alteracoes no AndroidManifest.xml do APK. Moram AQUI (data/android), nao na pasta android/, que e gerada pelo android/setup.sh.
# O build (build/android.sh) roda data/android/apply.py depois do setup e aplica estas linhas no manifesto gerado (idempotente).
#   permission <nome>            -> <uses-permission android:name="<nome>"/>
#   feature <nome> [required=false] -> <uses-feature .../>
#   application <attr>="<valor>"  -> atributo na tag <application> (troca se ja existir)
#   activity <attr>="<valor>"     -> atributo na 1a tag <activity>
permission android.permission.INTERNET
permission android.permission.RECORD_AUDIO
feature android.hardware.microphone required=false
